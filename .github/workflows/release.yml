name: Build and Release Skills

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # v5 is the first release declaring `using: node24`. v4 declares node20,
      # which GitHub deprecated on 2025-09-19; the runner force-migrates it to
      # Node 24 and emits a warning on every run.
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get install -y jq

      # Use koalaman's rolling "stable" channel rather than the apt shellcheck
      # package, which lags the current release and drifts with the runner image
      # (it shipped 0.9.0, the version skew behind the SC2317 incident). Running
      # the newest stable analyzer keeps CI aligned with current developer tooling
      # and lets new checks surface emergent issues early. Intentionally unpinned.
      #
      # The asset is selected from `uname -m` rather than hardcoded to x86_64.
      # GitHub's ubuntu-latest is amd64, so this resolves to the same download
      # there; the arch check is what lets a local `act` run execute the workflow
      # natively on an arm64 host. Emulating amd64 for this one download used to
      # force every later step through qemu, where the Bun-compiled Claude Code
      # installer segfaults. koalaman publishes linux.x86_64 and linux.aarch64
      # for the stable tag; an unrecognized machine name fails loudly rather than
      # guessing an asset name that would 404 further down.
      - name: Install latest stable ShellCheck
        run: |
          case "$(uname -m)" in
            x86_64)          sc_arch=x86_64 ;;
            aarch64|arm64)   sc_arch=aarch64 ;;
            *) echo "No ShellCheck stable asset for $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/stable/shellcheck-stable.linux.${sc_arch}.tar.xz"
          tar -xJf shellcheck.tar.xz
          sudo install shellcheck-stable/shellcheck /usr/local/bin/shellcheck
          rm -rf shellcheck-stable shellcheck.tar.xz
          shellcheck --version

      - name: Install and verify plugins
        run: ./scripts/install-and-verify.sh

      - name: Generate version
        id: version
        run: |
          TIMESTAMP=$(date -u '+%Y%m%d-%H%M%S')
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          VERSION="${TIMESTAMP}.${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Build skill ZIPs
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-skills.sh

      - name: List artifacts
        run: ls -la dist/

      - name: Update latest release
        # Skip under `act` (local runs set ACT=true): this publishes to the real
        # GitHub releases and pushes tag deletions, which must only happen on CI.
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete existing 'latest' release if it exists
          gh release delete latest --yes 2>/dev/null || true

          # Delete the tag too so we can recreate it
          git push origin :refs/tags/latest 2>/dev/null || true

          # Create new release with all ZIPs
          gh release create latest \
            dist/*.zip \
            --title "Latest Build (${{ steps.version.outputs.version }})" \
            --notes "Continuous build from commit ${{ github.sha }}

          **Version:** \`${{ steps.version.outputs.version }}\`

          Download individual skill ZIPs and upload to Claude Desktop via **Settings > Capabilities**.

          See [README](https://github.com/${{ github.repository }}#claude-desktop--claude-web) for installation instructions."
